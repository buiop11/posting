[project]
name = "ai-blog-studio"
version = "1.0.0"
description = "네이버·티스토리 AI 포스팅 작성 및 편집 데스크톱 프로그램"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "openai>=1.40",
    "keyring>=25.0",
    "markdown-it-py>=3.0",
    "Pillow>=10.0",
    "imageio-ffmpeg==0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
